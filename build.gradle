plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex('net\\.runelite.*')
		}
	}
	mavenCentral()
}

def lombokVersion = '1.18.46'
def runeLiteVersion = 'latest.' + (project.hasProperty('use.snapshot') ? 'integration' : 'release')
def junitVersion = '5.5.2'

dependencies {
	compileOnly group: 'org.projectlombok', name: 'lombok', version: lombokVersion
	annotationProcessor group: 'org.projectlombok', name: 'lombok', version: lombokVersion
	testCompileOnly group: 'org.projectlombok', name: 'lombok', version: lombokVersion
	testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: lombokVersion

	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
	runtimeOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion

	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: junitVersion
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: junitVersion
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: junitVersion
	testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: '1.5.2'

	testImplementation(group: 'org.mockito', name: 'mockito-core', version: '4.11.0')
	testImplementation(group: 'com.google.inject.extensions', name: 'guice-testlib', version: '4.1.0') {
		exclude group: 'com.google.inject', module: 'guice'
	}
}

group = 'tccrewplugin'
version = '1.14.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	sourceCompatibility = JavaVersion.VERSION_11.toString()
	targetCompatibility = JavaVersion.VERSION_11.toString()
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'generator'
	}
}

tasks.register('generateResources', Test) {
	useJUnitPlatform {
		includeTags 'generator'
	}
}

tasks.register('run', JavaExec) {
	group = 'application'
	description = 'Launches RuneLite with the TcCrew plugin loaded.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'tccrewplugin.DinkTest'
	jvmArgs '-ea'
	args '--developer-mode', '--debug'
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': 'tccrewplugin.DinkTest', 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

